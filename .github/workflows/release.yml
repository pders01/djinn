name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.1.0-alpha.1)'
        required: true

permissions:
  contents: write  # GitHub Releases write access

jobs:
  build-bundle:
    # Apple-silicon runner with Xcode preinstalled. The Metal Toolchain
    # may need a one-time download per runner image — `xcodebuild
    # -downloadComponent` is idempotent.
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Install Zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Ensure Metal Toolchain
        # ghostty's renderer compiles `.metal` shaders via xcrun -> metal.
        # macos-15 runners ship multiple Xcode versions; the default
        # selection via `xcode-select -p` is sometimes pinned to an
        # older release that pre-dates `-downloadComponent`
        # (Xcode 15.3+). Explicitly switch to the newest installed
        # Xcode before probing so the toolchain download path actually
        # works when Metal compiler is missing.
        run: |
          newest_xcode=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$newest_xcode" ]; then
            echo "Selecting $newest_xcode"
            sudo xcode-select -s "$newest_xcode"
          fi
          if xcrun --find metal >/dev/null 2>&1; then
            echo "Metal compiler at $(xcrun --find metal)"
          else
            sudo xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Cache zig packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-${{ runner.os }}-${{ runner.arch }}-

      - name: Build signed Djinn.app (ad-hoc)
        # `bundle-sign` step in build.zig:
        #   - copies libghostty.dylib into the bundle
        #   - install_name_tool rewrites rpath to @loader_path
        #   - codesign --force --sign - --deep
        # ReleaseFast is pinned for the bundle path regardless of
        # -Doptimize, so the distributed artifact never carries
        # libghostty's verifyIntegrity overhead.
        run: ./scripts/build.sh bundle-sign

      - name: Verify bundle metadata
        run: |
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            zig-out/Djinn.app/Contents/Info.plist
          codesign --verify --verbose=2 zig-out/Djinn.app

      - name: Zip bundle for release
        run: |
          cd zig-out
          zip -r -y Djinn-${{ steps.tag.outputs.name }}-${{ runner.arch }}.zip Djinn.app
          shasum -a 256 Djinn-${{ steps.tag.outputs.name }}-${{ runner.arch }}.zip > \
            Djinn-${{ steps.tag.outputs.name }}-${{ runner.arch }}.zip.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          # Mark non-stable tags as prereleases — alpha / beta / rc.
          prerelease: ${{ contains(steps.tag.outputs.name, '-') }}
          generate_release_notes: true
          files: |
            zig-out/Djinn-${{ steps.tag.outputs.name }}-${{ runner.arch }}.zip
            zig-out/Djinn-${{ steps.tag.outputs.name }}-${{ runner.arch }}.zip.sha256

  build-linux:
    # Linux tarball — x86_64 today; aarch64 is a follow-up (the
    # `ubuntu-24.04-arm` runners exist but the second arch doubles the
    # cache + queue cost for an alpha audience that's overwhelmingly
    # amd64). Runs in parallel with build-bundle and publishes to the
    # same tag via softprops/action-gh-release's UPSERT semantics.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Install GTK / VTE dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libvte-2.91-gtk4-dev \
            libglib2.0-dev \
            pkg-config

      - name: Resolve cache date
        id: cache-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache gtk4-layer-shell DESTDIR
        id: cache-gls
        uses: actions/cache@v4
        with:
          path: ~/gtk4-layer-shell-prefix
          key: gtk4-layer-shell-v1.3.0-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-date.outputs.date }}

      - name: Build gtk4-layer-shell from source
        if: steps.cache-gls.outputs.cache-hit != 'true'
        # noble's universe doesn't ship libgtk4-layer-shell-dev; pin
        # a known-good tag, build with `--prefix=/usr`, stage via
        # DESTDIR for the daily cache.
        run: |
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev meson ninja-build
          GTK4_LAYER_SHELL_TAG=v1.3.0
          git clone --depth 1 --branch "$GTK4_LAYER_SHELL_TAG" \
            https://github.com/wmww/gtk4-layer-shell.git \
            /tmp/gtk4-layer-shell
          cd /tmp/gtk4-layer-shell
          meson setup build --prefix=/usr \
            -Dexamples=false -Ddocs=false -Dtests=false \
            -Dsmoke-tests=false -Dintrospection=false -Dvapi=false
          ninja -C build
          DESTDIR="$HOME/gtk4-layer-shell-prefix" ninja -C build install

      - name: Install gtk4-layer-shell into /usr
        run: |
          sudo cp -a "$HOME/gtk4-layer-shell-prefix/." /
          sudo ldconfig

      - name: Install Zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Cache zig packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-${{ runner.os }}-${{ runner.arch }}-

      - name: Build + stage tarball
        # Stage into a top-level `djinn-<tag>-x86_64-linux/` directory
        # so users extracting the tarball get a single named dir
        # instead of files spilling into $PWD. `zig build install
        # --prefix DIR` produces DIR/bin, DIR/share, DIR/lib —
        # standard tarball layout out of the box.
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          OUT="djinn-${TAG}-x86_64-linux"
          zig build install -Doptimize=ReleaseSafe --prefix "${OUT}"
          cp LICENSE NOTICES.md README.md "${OUT}/"
          tar -czf "${OUT}.tar.gz" "${OUT}"
          # `sha256sum` is coreutils — always present on Linux. macOS
          # builds use `shasum -a 256` because BSD coreutils doesn't
          # ship `sha256sum`.
          sha256sum "${OUT}.tar.gz" > "${OUT}.tar.gz.sha256"
          mkdir -p zig-out
          mv "${OUT}.tar.gz" "${OUT}.tar.gz.sha256" zig-out/

      - name: Smoke binary
        run: ./djinn-${{ steps.tag.outputs.name }}-x86_64-linux/bin/djinn --version

      - name: Publish release
        # softprops/action-gh-release@v2 UPSERTs the release for this
        # tag, so build-bundle and build-linux can both target the
        # same tag without coordination. `prerelease` flips the same
        # way as build-bundle so dash-suffixed tags stay marked.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          prerelease: ${{ contains(steps.tag.outputs.name, '-') }}
          generate_release_notes: true
          files: |
            zig-out/djinn-${{ steps.tag.outputs.name }}-x86_64-linux.tar.gz
            zig-out/djinn-${{ steps.tag.outputs.name }}-x86_64-linux.tar.gz.sha256
