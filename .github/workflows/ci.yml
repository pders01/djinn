name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs when a new commit lands on the same ref —
# avoids stacking PR builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Apple-silicon runner. Test path skips the Metal compile so this
    # works on stock GitHub macOS images without the Metal Toolchain.
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The locked flake supplies Zig 0.17.1 and SDK 26.5; system Xcode
      # remains responsible only for executing Metal tools in the bundle job.
      - name: Install Nix
        uses: cachix/install-nix-action@v31

      # Cache the global archive cache (ghostty fetch is the slow
      # part on a cold runner — minutes vs seconds).
      - name: Cache zig packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-${{ runner.os }}-${{ runner.arch }}-

      - name: Run unit suite
        run: nix develop --command ./scripts/build.sh test test-shared

      - name: Check native host and generate runtime resources
        # Keep this job independent of Metal; the bundle job covers linking.
        run: nix develop --command ./scripts/build.sh check resources

      - name: Compile-check Linux without GTK or pkg-config
        run: |
          nix develop --command ./scripts/build.sh check -Dtarget=x86_64-linux-gnu
          nix develop --command ./scripts/build.sh check -Dtarget=aarch64-linux-gnu

  linux:
    # Ubuntu 24.04 LTS — matches the runtime targeted by
    # contrib/packaging/debian/control. Pinned (not ubuntu-latest) so
    # GitHub's "latest" rollover doesn't surprise the GTK / VTE pin.
    # gtk4-layer-shell wasn't packaged for noble (first appears in
    # 24.10 oracular), so we build it from a pinned tag below.
    # The platform-aware wrapper skips Apple environment/patches on Linux.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GTK / VTE dev headers
        # Matches contrib/packaging/debian/control's Build-Depends.
        # pkg-config drives djinn's linkSystemLibrary discovery.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libvte-2.91-gtk4-dev \
            libglib2.0-dev \
            pkg-config

      - name: Resolve cache date
        # Daily-rotated cache key so the gtk4-layer-shell build runs
        # once per UTC day even when the pinned tag hasn't moved.
        id: cache-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache gtk4-layer-shell DESTDIR
        id: cache-gls
        uses: actions/cache@v4
        with:
          path: ~/gtk4-layer-shell-prefix
          key: gtk4-layer-shell-v1.3.0-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-date.outputs.date }}

      - name: Build gtk4-layer-shell from source
        if: steps.cache-gls.outputs.cache-hit != 'true'
        # noble's universe doesn't ship libgtk4-layer-shell-dev (first
        # appears in 24.10 oracular); pin a known-good tag, build with
        # `--prefix=/usr` but stage via DESTDIR so the cached tree can
        # be copied into / on every run with the .pc prefix intact.
        run: |
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev meson ninja-build
          GTK4_LAYER_SHELL_TAG=v1.3.0
          git clone --depth 1 --branch "$GTK4_LAYER_SHELL_TAG" \
            https://github.com/wmww/gtk4-layer-shell.git \
            /tmp/gtk4-layer-shell
          cd /tmp/gtk4-layer-shell
          meson setup build --prefix=/usr \
            -Dexamples=false -Ddocs=false -Dtests=false \
            -Dsmoke-tests=false -Dintrospection=false -Dvapi=false
          ninja -C build
          DESTDIR="$HOME/gtk4-layer-shell-prefix" ninja -C build install

      - name: Install gtk4-layer-shell into /usr
        run: |
          sudo cp -a "$HOME/gtk4-layer-shell-prefix/." /
          sudo ldconfig

      - name: Install Zig 0.17.1
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Cache zig packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-${{ runner.os }}-${{ runner.arch }}-

      - name: Run unit suite
        run: ./scripts/build.sh check test test-shared

      - name: Build debug exe (smoke)
        # Catches link-time regressions the test suite can't see —
        # GTK / VTE symbols are only checked at link time, not under
        # the test target's smaller surface.
        run: ./scripts/build.sh

      - name: Build ReleaseSafe (distribution path)
        # The optimization level distros + `just install-arch` ship.
        # Catches comptime / safety regressions that only fire under
        # release optimization.
        run: ./scripts/build.sh -Doptimize=ReleaseSafe -Dsystem-install=true

      - name: Relocated CLI smoke without desktop or user configuration
        # Check dynamic linkage and early CLI exit, not GTK interaction.
        run: |
          SMOKE_DIR=$(mktemp -d)
          trap 'rm -rf "$SMOKE_DIR"' EXIT
          mkdir "$SMOKE_DIR/home"
          cp zig-out/bin/djinn "$SMOKE_DIR/djinn"
          env -i PATH=/usr/bin:/bin HOME="$SMOKE_DIR/home" "$SMOKE_DIR/djinn" --version
          env -i PATH=/usr/bin:/bin HOME="$SMOKE_DIR/home" "$SMOKE_DIR/djinn" --help
          test ! -e "$SMOKE_DIR/home/.config"

  bundle:
    # Exercises the full distributable path: Metal shader compile via
    # xcrun, bundle-local rpaths, runtime resources, plist version
    # interpolation, and ad-hoc codesign. release.yml uses the same build
    # path; publishing still depends on that workflow completing separately.
    runs-on: macos-15
    timeout-minutes: 45
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Ensure Metal Toolchain
        # ghostty's renderer compiles `.metal` shaders via xcrun -> metal.
        # macos-15 runners ship multiple Xcode versions; the default
        # selection via `xcode-select -p` is sometimes pinned to an
        # older release that pre-dates `-downloadComponent`
        # (Xcode 15.3+). Explicitly switch to the newest installed
        # Xcode before probing so the toolchain download path actually
        # works when Metal compiler is missing.
        run: |
          xcode_paths=(/Applications/Xcode_*.app)
          newest_xcode=$(printf '%s\n' "${xcode_paths[@]}" | sort -V | tail -1)
          if [ -d "$newest_xcode" ]; then
            echo "Selecting $newest_xcode"
            sudo xcode-select -s "$newest_xcode"
          fi
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          # Finding the launcher is not enough; confirm the toolchain runs.
          xcrun -sdk macosx metal --version

      - name: Cache zig packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-${{ runner.os }}-${{ runner.arch }}-

      - name: Build signed Djinn.app (ad-hoc)
        run: nix develop --command ./scripts/build.sh bundle-sign

      - name: Verify bundle metadata
        run: |
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            zig-out/Djinn.app/Contents/Info.plist
          codesign --verify --verbose=2 zig-out/Djinn.app

      - name: Verify self-contained signed bundle
        run: ./scripts/verify-bundle.sh

      - name: Zip bundle
        run: |
          cd zig-out
          zip -r -y "Djinn-${GITHUB_SHA::7}-${{ runner.arch }}.zip" Djinn.app

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: Djinn-${{ github.sha }}-${{ runner.arch }}
          path: zig-out/Djinn-*.zip
          retention-days: 14
          if-no-files-found: error
