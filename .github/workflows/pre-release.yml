name: Pre-release

# Rolling pre-release: every push to main rebuilds the bundle and
# republishes the `pre-release` tag with a fresh artifact set, so
# users can `curl | bash` the installer and get the latest main-tip
# build without waiting for a stable tag cut.
#
# The `pre-release` tag is force-updated on every run; users pin to
# this label deliberately when they want bleeding-edge.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one pre-release build at a time. Newer pushes cancel older
# in-flight runs so the tag tracks HEAD instead of getting stuck on
# a stale build that finished after a newer one started.
concurrency:
  group: pre-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    # Darwin half runs first; it deletes the prior pre-release tag and
    # uploads the macOS bundle. `build-linux` `needs: publish` so the
    # linux tarball lands on the recreated release without racing the
    # delete step.
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Ensure Metal Toolchain
        # See ci.yml for the rationale on the xcode-select swap +
        # `xcrun --find metal` probe before falling back to
        # `-downloadComponent`.
        run: |
          newest_xcode=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$newest_xcode" ]; then
            echo "Selecting $newest_xcode"
            sudo xcode-select -s "$newest_xcode"
          fi
          if xcrun --find metal >/dev/null 2>&1; then
            echo "Metal compiler at $(xcrun --find metal)"
          else
            sudo xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Cache zig packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-${{ runner.os }}-${{ runner.arch }}-

      - name: Build signed Djinn.app (ad-hoc)
        run: ./scripts/build.sh bundle-sign

      - name: Verify bundle metadata
        run: |
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            zig-out/Djinn.app/Contents/Info.plist
          codesign --verify --verbose=2 zig-out/Djinn.app

      - name: Verify dylib linkage
        run: |
          otool -L zig-out/Djinn.app/Contents/MacOS/djinn | grep -q '@rpath/libghostty.dylib' \
            || { echo "::error::libghostty not linked via @rpath"; exit 1; }
          otool -l zig-out/Djinn.app/Contents/MacOS/djinn | grep -A2 LC_RPATH | grep -q '@loader_path' \
            || { echo "::error::@loader_path missing from LC_RPATH"; exit 1; }
          zig-out/Djinn.app/Contents/MacOS/djinn --version

      - name: Package release artifacts
        # `pre-release` tag is the stable label users pin to; the
        # zip + sha256 + install.sh stay alongside it. install.sh
        # is shipped from the repo so the curl|bash one-liner
        # always pulls the script that matches the build's release
        # layout.
        run: |
          cd zig-out
          zip -r -y "Djinn-pre-release-${{ runner.arch }}.zip" Djinn.app
          shasum -a 256 "Djinn-pre-release-${{ runner.arch }}.zip" \
            > "Djinn-pre-release-${{ runner.arch }}.zip.sha256"
          cp ../scripts/install-from-release.sh install.sh

      - name: Delete prior pre-release + tag
        # softprops/action-gh-release replaces assets in place on an
        # existing release, but doesn't move an existing tag. The
        # previous workflow force-pushed the tag first, then uploaded
        # — leaving a window where the moved tag pointed at HEAD
        # while GH Releases still served the prior run's zip
        # (stable filename: `Djinn-pre-release-${ARCH}.zip`). A user
        # running the curl|bash installer mid-window got a binary
        # one commit behind the advertised tag.
        #
        # Pre-delete the release + tag so softprops re-creates both
        # atomically alongside the fresh asset upload. Brief 404 in
        # place of stale-serve; retried download succeeds.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete pre-release --yes --cleanup-tag || true

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pre-release
          name: pre-release (rolling)
          prerelease: true
          # `make_latest: false` keeps the actual stable release as
          # the "Latest" badge target. pre-release is never the
          # default download.
          make_latest: false
          body: |
            Rolling build of `main` — refreshed every push.

            Install:
            ```
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/pre-release/install.sh | bash
            ```

            Pinned to commit `${{ github.sha }}`.
          files: |
            zig-out/Djinn-pre-release-${{ runner.arch }}.zip
            zig-out/Djinn-pre-release-${{ runner.arch }}.zip.sha256
            zig-out/install.sh

  build-linux:
    # Linux tarball published into the same `pre-release` GH release the
    # darwin half rebuilds on every push to main. Sequenced AFTER
    # `publish` so the delete-and-recreate dance in that job can't race
    # the linux upload — softprops/action-gh-release UPSERTs against an
    # existing release, which is exactly what we want here.
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GTK / VTE dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libvte-2.91-gtk4-dev \
            libglib2.0-dev \
            pkg-config

      - name: Resolve cache date
        id: cache-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache gtk4-layer-shell DESTDIR
        id: cache-gls
        uses: actions/cache@v4
        with:
          path: ~/gtk4-layer-shell-prefix
          key: gtk4-layer-shell-v1.3.0-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-date.outputs.date }}

      - name: Build gtk4-layer-shell from source
        if: steps.cache-gls.outputs.cache-hit != 'true'
        # noble's universe doesn't ship libgtk4-layer-shell-dev; pin
        # a known-good tag, build with `--prefix=/usr`, stage via
        # DESTDIR for the daily cache.
        run: |
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev meson ninja-build
          GTK4_LAYER_SHELL_TAG=v1.3.0
          git clone --depth 1 --branch "$GTK4_LAYER_SHELL_TAG" \
            https://github.com/wmww/gtk4-layer-shell.git \
            /tmp/gtk4-layer-shell
          cd /tmp/gtk4-layer-shell
          meson setup build --prefix=/usr \
            -Dexamples=false -Ddocs=false -Dtests=false \
            -Dsmoke-tests=false -Dintrospection=false -Dvapi=false
          ninja -C build
          DESTDIR="$HOME/gtk4-layer-shell-prefix" ninja -C build install

      - name: Install gtk4-layer-shell into /usr
        run: |
          sudo cp -a "$HOME/gtk4-layer-shell-prefix/." /
          sudo ldconfig

      - name: Install Zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Cache zig packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-${{ runner.os }}-${{ runner.arch }}-

      - name: Build + stage tarball
        run: |
          OUT="djinn-pre-release-x86_64-linux"
          zig build install -Doptimize=ReleaseSafe --prefix "${OUT}"
          cp LICENSE NOTICES.md README.md "${OUT}/"
          tar -czf "${OUT}.tar.gz" "${OUT}"
          # coreutils on Linux ships `sha256sum`; BSD's `shasum -a 256`
          # is what the macOS half uses. Keep them split rather than
          # depending on `shasum` everywhere (Arch's coreutils doesn't
          # bundle it).
          sha256sum "${OUT}.tar.gz" > "${OUT}.tar.gz.sha256"
          mkdir -p zig-out
          mv "${OUT}.tar.gz" "${OUT}.tar.gz.sha256" zig-out/

      - name: Smoke binary
        run: ./djinn-pre-release-x86_64-linux/bin/djinn --version

      - name: Upload linux tarball to pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pre-release
          name: pre-release (rolling)
          prerelease: true
          make_latest: false
          # Don't overwrite the body the darwin half wrote — leaving
          # `body` unset on an existing release preserves it.
          files: |
            zig-out/djinn-pre-release-x86_64-linux.tar.gz
            zig-out/djinn-pre-release-x86_64-linux.tar.gz.sha256
