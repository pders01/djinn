name: Pre-release

# Explicit policy: automatic main publication is DISABLED pending approval.
# Select an existing version tag; dispatching from main never builds main-tip
# under another tag. This wrapper shares all validation and publication logic.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to promote to rolling pre-release (e.g. v0.1.0-alpha.1)'
        type: string
        required: true

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ inputs.tag }}
      rolling: true
